<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Stadion Sitzmodell Renderprüfung</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/stadium_editor/static/stadium_editor/stage/vendor/three.module.js",
        "three/addons/": "/stadium_editor/static/stadium_editor/stage/vendor/addons/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #07111a; }
    canvas { display: block; width: 1100px; height: 700px; }
  </style>
</head>
<body>
  <canvas id="stage" width="1100" height="700"></canvas>
  <script type="module">
    import {
      createStadiumStage, RULES,
    } from '/stadium_editor/static/stadium_editor/stage/stadium_stage.js?v=35';

    const rows = 12, seats = 24;
    const values = Array.from({length: rows * seats}, (_unused, index) => {
      const row = Math.floor(index / seats);
      const col = index % seats;
      if (col >= 9 && col <= 14 && row >= 2 && row <= 9) return 2;
      return (row + col) % 7 === 0 ? 1 : 0;
    });
    const rle = [];
    for (const colour of values) {
      const previous = rle.at(-1);
      if (previous?.[1] === colour) previous[0]++;
      else rle.push([1, colour]);
    }
    const scene = {
      mainStand: 'SUED',
      palette: ['#ffd400', '#101216', '#c8102e'],
      blocks: [{
        id: 'NORD-NAH', stand: 'NORD', tier: 'UNTER', order: 0,
        rows, seats, quad: [[-12, 15], [12, 15], [12, 27], [-12, 27]],
        z0: .5, z1: 10, type: 'seating', rle,
      }],
      outline: [[-13, 14], [13, 14], [13, 28], [-13, 28]],
      roof: {mode: 'explicit', segments: []},
    };
    const stage = createStadiumStage({
      canvas: document.getElementById('stage'),
      scene, width: 1100, height: 700, drawPitch: true,
      rules: RULES,
      facade: false, surroundings: false,
      view: 'orbit', orbit: {
        azimuth: 165, elevation: 35, distance: 20, fov: 30, targetZ: 6,
      },
      lighting: 'day',
    });
    stage.render();
    document.body.dataset.seatCount = String(stage.stats.seats);
    document.body.dataset.seatPaletteCounts =
      JSON.stringify(stage.stats.seatPaletteCounts);
    window.seatModelHarness = stage;
  </script>
</body>
</html>
