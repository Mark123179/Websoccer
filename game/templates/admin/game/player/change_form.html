{% extends "admin/change_form.html" %}
{% load static %}

{% block object-tools %}{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'game/admin_compact.css' %}">
<style>
    .ws-admin-tabs {
        align-items: stretch;
        background: var(--darkened-bg);
        border: 1px solid var(--hairline-color);
        border-bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin: 0 0 18px;
    }

    .object-tools .historylink {
        display: none;
    }

    .ws-admin-tab-button {
        background: transparent;
        border: 0;
        border-right: 1px solid var(--hairline-color);
        color: var(--body-quiet-color);
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        padding: 14px 18px;
        text-transform: uppercase;
    }

    .ws-admin-tab-button:hover,
    .ws-admin-tab-button.is-active {
        background: rgba(0, 155, 190, 0.18);
        color: var(--link-fg);
    }

    .ws-admin-tab-button.is-active {
        box-shadow: inset 0 -3px 0 var(--link-fg);
    }

    .ws-admin-tab-hidden {
        display: none !important;
    }

    .ws-admin-preview-table {
        border-collapse: collapse;
        margin: 4px 0 8px;
        min-width: 620px;
        width: 100%;
    }

    .ws-admin-preview-table th,
    .ws-admin-preview-table td {
        border: 1px solid var(--hairline-color);
        padding: 8px 10px;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
    }

    .ws-admin-preview-table th:first-child,
    .ws-admin-preview-table td:first-child {
        text-align: left;
    }

    .ws-admin-preview-table th {
        background: var(--darkened-bg);
        color: var(--body-fg);
        font-weight: 800;
    }

    .ws-admin-muted {
        color: var(--body-quiet-color);
    }

    .ws-strength-panel h3 {
        color: var(--body-fg);
        font-size: 14px;
        margin: 18px 0 8px;
    }

    .ws-strength-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 6px 0 14px;
    }

    .ws-strength-card {
        background: var(--darkened-bg);
        border: 1px solid var(--hairline-color);
        min-width: 220px;
        padding: 12px 14px;
    }

    .ws-strength-card span:first-child {
        color: var(--body-quiet-color);
        display: block;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
    }

    .ws-strength-card strong {
        display: inline-block;
        font-size: 24px;
        margin-top: 4px;
    }

    .ws-strength-card-main strong {
        color: #72f2a5;
    }

    .ws-strength-card-max strong {
        color: #ffd86b;
    }

    .ws-strength-lines {
        border: 1px solid var(--hairline-color);
        margin-top: 8px;
        max-width: 720px;
    }

    .ws-strength-line {
        align-items: center;
        background: var(--body-bg);
        border-bottom: 1px solid var(--hairline-color);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 10px 12px;
    }

    .ws-strength-line:nth-child(odd) {
        background: var(--darkened-bg);
    }

    .ws-strength-line:last-child {
        border-bottom: 0;
    }

    .ws-strength-label {
        font-weight: 800;
    }

    .ws-info {
        cursor: help;
        font-weight: 800;
        margin-left: 4px;
    }

    .ws-strength-table th {
        width: 210px;
    }

    .ws-strength-table td:nth-child(2) {
        font-weight: 800;
    }

    .ws-strength-positive {
        color: #72f2a5;
    }

    .ws-strength-negative {
        color: #ff7676;
    }

    .ws-strength-neutral {
        color: #c7d7df;
    }

    .ws-rating-chart,
    .ws-market-chart {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 8px 0 14px;
    }

    .ws-rating-chart svg,
    .ws-market-chart svg {
        border: 1px solid var(--hairline-color);
        border-radius: 8px;
        display: block;
    }

    .ws-rating-chart svg {
        height: 118px;
        width: 320px;
    }

    .ws-market-chart svg {
        height: 124px;
        width: 340px;
    }

    .ws-rating-chart strong,
    .ws-market-chart strong {
        color: #28d7e8;
        font-size: 22px;
    }

    .ws-rating-chart span,
    .ws-market-chart span {
        color: var(--body-quiet-color);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .ws-strength-chart {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 8px 0 18px;
        max-width: 380px;
    }

    .ws-strength-chart svg {
        border: 1px solid var(--hairline-color);
        border-radius: 8px;
        display: block;
        height: 132px;
        width: 360px;
    }

    .ws-strength-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .ws-strength-legend span {
        align-items: center;
        color: var(--body-fg);
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        gap: 6px;
    }

    .ws-strength-legend i {
        border-radius: 999px;
        display: inline-block;
        height: 8px;
        width: 18px;
    }

    .ws-season-career-grid {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .ws-season-career-grid h3 {
        color: var(--body-fg);
        font-size: 14px;
        margin: 4px 0 8px;
        text-transform: uppercase;
    }

    .form-row .fieldBox label {
        margin-right: 8px;
        min-width: 0;
        width: auto;
    }

    .form-row .fieldBox select,
    .form-row .fieldBox input {
        margin-left: 0;
    }

    .ws-admin-portrait-preview {
        align-items: center;
        display: flex;
        gap: 14px;
    }

    .ws-admin-portrait-preview img {
        flex: 0 0 auto;
    }

    .ws-admin-portrait-preview span {
        color: var(--body-quiet-color);
        font-size: 12px;
    }

</style>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tabs = [
            { id: 'profile', label: 'SPIELERPROFIL', titles: ['SPIELERPROFIL'] },
            {
                id: 'strength',
                label: 'STAERKE',
                titles: ['STAERKE', 'STAERKE-VERLAUF']
            },
            {
                id: 'source',
                label: 'SOURCE',
                titles: ['SOURCE', 'EXTERNE IDS', 'MARKTWERT-VERLAUF']
            },
            {
                id: 'season',
                label: 'SAISON',
                titles: ['SAISON']
            },
            {
                id: 'transfers',
                label: 'TRANSFERHISTORIE WS',
                titles: ['TRANSFERHISTORIE WS']
            },
            {
                id: 'history',
                label: 'GESCHICHTE',
                titles: ['GESCHICHTE']
            }
        ];
        const tabByTitle = new Map();
        tabs.forEach(function (tab) {
            tab.titles.forEach(function (title) {
                tabByTitle.set(title, tab.id);
            });
        });

        const containers = Array.from(
            document.querySelectorAll('fieldset.module, .inline-group')
        );
        const groupedContainers = [];

        containers.forEach(function (container) {
            const headline = container.querySelector(':scope > h2');
            if (!headline) {
                return;
            }

            const title = headline.textContent.trim().toUpperCase();
            let tabId = tabByTitle.get(title);
            if (!tabId) {
                tabs.some(function (tab) {
                    return tab.titles.some(function (mappedTitle) {
                        if (title.startsWith(mappedTitle)) {
                            tabId = tab.id;
                            return true;
                        }

                        return false;
                    });
                });
            }
            if (!tabId) {
                return;
            }

            container.dataset.wsAdminTab = tabId;
            groupedContainers.push(container);
        });

        if (!groupedContainers.length) {
            return;
        }

        const nav = document.createElement('nav');
        nav.className = 'ws-admin-tabs';
        nav.setAttribute('aria-label', 'Spieler-Verwaltung');

        const contentMain = document.getElementById('content-main');
        if (!contentMain) {
            return;
        }

        tabs.forEach(function (tab, index) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'ws-admin-tab-button';
            button.textContent = tab.label;
            button.dataset.wsAdminTabButton = tab.id;
            button.addEventListener('click', function () {
                showTab(tab.id);
            });
            nav.appendChild(button);

            if (index === 0) {
                button.classList.add('is-active');
            }
        });

        contentMain.prepend(nav);

        function showTab(tabId) {
            groupedContainers.forEach(function (container) {
                container.classList.toggle(
                    'ws-admin-tab-hidden',
                    container.dataset.wsAdminTab !== tabId
                );
            });

            nav.querySelectorAll('.ws-admin-tab-button').forEach(function (button) {
                button.classList.toggle(
                    'is-active',
                    button.dataset.wsAdminTabButton === tabId
                );
            });
        }

        showTab('profile');
    });
</script>
{% endblock %}
