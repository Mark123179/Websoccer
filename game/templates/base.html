<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>

    <style>

        :root {
            --app-bg: #03070c;
            --stadium-bg: #07111a;
            --panel: rgba(9, 23, 34, 0.82);
            --panel-strong: rgba(12, 31, 45, 0.94);
            --panel-soft: rgba(17, 43, 58, 0.72);
            --line: rgba(44, 231, 255, 0.18);
            --line-strong: rgba(44, 231, 255, 0.38);
            --cyan: #22e6ff;
            --cyan-soft: rgba(34, 230, 255, 0.14);
            --green: #30f29c;
            --yellow: #ffd166;
            --red: #ff5570;
            --text: #f4fbff;
            --muted: rgba(244, 251, 255, 0.64);
            --faint: rgba(244, 251, 255, 0.38);
            --dark-text: #061018;
            --radius: 8px;
            --shadow: 0 18px 70px rgba(0, 0, 0, 0.46);
            --glow: 0 0 28px rgba(34, 230, 255, 0.18);
            --sidebar: 232px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 74% 8%, rgba(34, 230, 255, 0.14), transparent 24%),
                radial-gradient(circle at 40% 110%, rgba(48, 242, 156, 0.12), transparent 28%),
                linear-gradient(135deg, #02050a 0%, #07121d 48%, #02050a 100%);
            color: var(--text);
            font-family: Inter, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 0;
        }

        body::before {
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 56px 56px;
            content: "";
            inset: 0;
            pointer-events: none;
            position: fixed;
            z-index: -1;
        }

        a {
            color: var(--cyan);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            color: #8ff5ff;
        }

        .navbar {
            background:
                linear-gradient(180deg, rgba(3, 11, 18, 0.98), rgba(3, 9, 15, 0.94)),
                radial-gradient(circle at 80% 10%, rgba(34, 230, 255, 0.14), transparent 34%);
            border-right: 1px solid var(--line);
            box-shadow: 12px 0 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100vh;
            left: 0;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            width: var(--sidebar);
            z-index: 10;
        }

        .brand {
            align-items: center;
            color: var(--text);
            display: flex;
            font-size: 25px;
            font-weight: 900;
            gap: 11px;
            margin-bottom: 24px;
        }

        .brand::before {
            align-items: center;
            border: 2px solid var(--cyan);
            border-radius: 10px;
            box-shadow: var(--glow);
            color: var(--cyan);
            content: "W";
            display: inline-flex;
            font-size: 18px;
            height: 38px;
            justify-content: center;
            width: 38px;
        }

        .brand strong {
            color: var(--cyan);
        }

        .navbar a {
            align-items: center;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--muted);
            display: flex;
            font-size: 15px;
            font-weight: 700;
            gap: 12px;
            min-height: 46px;
            padding: 0 14px;
        }

        .navbar a::before {
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: var(--cyan);
            content: attr(data-icon);
            display: inline-flex;
            font-size: 12px;
            font-weight: 900;
            height: 26px;
            justify-content: center;
            width: 26px;
        }

        .navbar a:first-of-type {
            background: linear-gradient(90deg, rgba(34, 230, 255, 0.2), rgba(34, 230, 255, 0.06));
            border-color: var(--line-strong);
            color: var(--text);
            box-shadow: inset 3px 0 0 var(--cyan);
        }

        .sidebar-profile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-top: auto;
            padding: 14px;
        }

        .sidebar-profile span {
            color: var(--muted);
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .sidebar-profile strong {
            color: var(--text);
            display: block;
            font-size: 15px;
        }

        .container {
            margin-left: var(--sidebar);
            min-height: 100vh;
        }

        .hero {
            padding: 44px;
        }

        .hero h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .hero p {
            color: var(--muted);
            margin: 0;
        }

        .dashboard-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            padding: 0 44px 44px;
        }

        .panel,
        .dashboard-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel {
            padding: 20px;
        }

        .panel h2,
        .panel h3 {
            margin-top: 0;
        }

        .stat-value {
            color: var(--cyan);
            display: block;
            font-size: 28px;
            font-weight: 900;
            margin-top: 8px;
        }

        .muted {
            color: var(--muted);
        }

        .button-link,
        .primary-action,
        .card-action {
            background: linear-gradient(180deg, #1bd9ee, #06879a);
            border: 1px solid rgba(93, 249, 255, 0.46);
            border-radius: var(--radius);
            color: #ffffff;
            display: inline-flex;
            font-size: 14px;
            font-weight: 800;
            justify-content: center;
            min-height: 42px;
            padding: 11px 18px;
            text-decoration: none;
        }

        .club-dashboard {
            background:
                linear-gradient(rgba(2, 7, 12, 0.72), rgba(2, 7, 12, 0.96)),
                radial-gradient(circle at 55% 0%, rgba(40, 215, 255, 0.2), transparent 26%),
                linear-gradient(120deg, rgba(8, 26, 37, 0.9), rgba(4, 10, 16, 0.96));
            min-height: 100vh;
            padding: 20px 28px 28px;
            position: relative;
        }

        .club-dashboard::before {
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.34), transparent 5%),
                radial-gradient(ellipse at 20% 15%, rgba(255, 255, 255, 0.16), transparent 12%),
                radial-gradient(ellipse at 80% 18%, rgba(255, 255, 255, 0.14), transparent 13%),
                linear-gradient(180deg, rgba(20, 140, 78, 0.18), transparent 42%);
            content: "";
            inset: 0;
            opacity: 0.8;
            pointer-events: none;
            position: absolute;
        }

        .club-dashboard > * {
            position: relative;
            z-index: 1;
        }

        .app-topbar {
            align-items: center;
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(260px, 1fr) minmax(280px, 420px) auto auto 170px;
            margin-bottom: 18px;
        }

        .club-switcher {
            align-items: center;
            display: flex;
            gap: 14px;
        }

        .club-switcher img {
            height: 58px;
            object-fit: contain;
            width: 58px;
        }

        .club-switcher h1 {
            color: var(--text);
            font-size: 25px;
            line-height: 1.1;
            margin: 0;
        }

        .club-switcher span,
        .top-date span {
            color: var(--muted);
            display: block;
            font-size: 13px;
            margin-top: 4px;
        }

        .search-box {
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--faint);
            display: flex;
            min-height: 48px;
            padding: 0 16px;
        }

        .top-icons {
            align-items: center;
            display: flex;
            gap: 12px;
        }

        .top-icon {
            align-items: center;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--muted);
            display: inline-flex;
            height: 42px;
            justify-content: center;
            position: relative;
            width: 42px;
        }

        .top-icon span {
            align-items: center;
            background: var(--cyan);
            border-radius: 999px;
            color: var(--dark-text);
            display: inline-flex;
            font-size: 11px;
            font-weight: 900;
            height: 18px;
            justify-content: center;
            position: absolute;
            right: -6px;
            top: -7px;
            width: 18px;
        }

        .top-date {
            color: var(--text);
            font-size: 14px;
            line-height: 1.2;
            min-width: 116px;
        }

        .dashboard-grid-main {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.1fr 1.05fr 1fr;
        }

        .dashboard-grid-mid {
            display: grid;
            gap: 16px;
            grid-template-columns: 0.9fr 0.9fr 0.95fr 0.8fr;
            margin-top: 16px;
        }

        .dashboard-grid-bottom {
            display: grid;
            gap: 16px;
            grid-template-columns: 0.9fr 1fr 1.15fr;
            margin-top: 16px;
        }

        .card-title {
            color: var(--text);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.4px;
            margin: 0 0 14px;
            text-transform: uppercase;
        }

        .club-overview-card,
        .next-match-card,
        .league-table-card,
        .squad-preview-card,
        .tactics-card,
        .transfer-card,
        .match-result-card,
        .kits-card,
        .news-card,
        .finance-card {
            padding: 18px;
        }

        .club-overview-card,
        .next-match-card,
        .match-result-card {
            background:
                linear-gradient(rgba(7, 20, 31, 0.88), rgba(5, 15, 23, 0.9)),
                radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.16), transparent 22%);
        }

        .overview-content {
            align-items: center;
            display: grid;
            gap: 20px;
            grid-template-columns: 150px 1fr;
        }

        .overview-crest,
        .match-crest {
            filter: drop-shadow(0 0 18px rgba(34, 230, 255, 0.28));
            height: 136px;
            object-fit: contain;
            width: 136px;
        }

        .match-result-card .match-crest {
            height: 70px;
            width: 70px;
        }

        .overview-name h2 {
            color: var(--text);
            font-size: 26px;
            line-height: 1.12;
            margin: 0 0 10px;
        }

        .overview-meta {
            color: var(--muted);
            display: grid;
            gap: 6px;
            font-size: 14px;
        }

        .overview-stats {
            border-top: 1px solid var(--line);
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-top: 20px;
            padding-top: 15px;
        }

        .mini-stat {
            display: grid;
            gap: 5px;
        }

        .mini-stat span {
            color: var(--faint);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .mini-stat strong {
            color: var(--text);
            font-size: 18px;
        }

        .mood-chip {
            align-items: center;
            color: var(--green);
            display: inline-flex;
            gap: 6px;
            font-weight: 800;
        }

        .form-dots {
            display: flex;
            gap: 4px;
        }

        .form-dots i {
            align-items: center;
            background: rgba(48, 242, 156, 0.18);
            border: 1px solid rgba(48, 242, 156, 0.5);
            border-radius: 4px;
            color: var(--green);
            display: inline-flex;
            font-size: 10px;
            font-style: normal;
            font-weight: 900;
            height: 18px;
            justify-content: center;
            width: 18px;
        }

        .matchup {
            align-items: center;
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr auto 1fr;
            text-align: center;
        }

        .match-team {
            display: grid;
            gap: 8px;
            justify-items: center;
        }

        .match-team strong {
            color: var(--text);
            font-size: 14px;
        }

        .vs-mark {
            color: var(--text);
            font-size: 36px;
            font-weight: 900;
        }

        .match-meta {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 16px 0 0;
            text-align: center;
        }

        .card-action {
            margin-top: 16px;
            width: 100%;
        }

        .league-table {
            border-collapse: collapse;
            width: 100%;
        }

        .league-table th,
        .league-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 13px;
            padding: 10px 8px;
            text-align: left;
        }

        .league-table th {
            color: var(--faint);
            font-size: 11px;
            text-transform: uppercase;
        }

        .league-table .current-row td {
            background: rgba(34, 230, 255, 0.08);
            color: var(--text);
            font-weight: 800;
        }

        .points-cell {
            color: var(--cyan) !important;
            font-weight: 900 !important;
        }

        .squad-table-compact {
            border-collapse: collapse;
            width: 100%;
        }

        .squad-table-compact th,
        .squad-table-compact td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 12px;
            padding: 7px 6px;
            text-align: left;
            vertical-align: middle;
        }

        .squad-table-compact th {
            color: var(--faint);
            font-size: 10px;
            text-transform: uppercase;
        }

        .squad-table-compact strong {
            color: var(--text);
            display: block;
            font-size: 13px;
        }

        .player-mini {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .player-mini img {
            border-radius: 4px;
            height: 32px;
            object-fit: cover;
            width: 32px;
        }

        .fitness {
            color: var(--green);
            font-weight: 900;
        }

        .pitch {
            aspect-ratio: 4 / 3;
            background:
                linear-gradient(rgba(48, 242, 156, 0.06), rgba(48, 242, 156, 0.04)),
                repeating-linear-gradient(90deg, rgba(80, 255, 160, 0.08) 0 12%, rgba(5, 30, 20, 0.16) 12% 24%);
            border: 1px solid rgba(48, 242, 156, 0.38);
            border-radius: var(--radius);
            margin-top: 12px;
            overflow: hidden;
            position: relative;
        }

        .pitch::before {
            border: 1px solid rgba(255, 255, 255, 0.24);
            content: "";
            inset: 20px;
            position: absolute;
        }

        .pitch::after {
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            content: "";
            height: 76px;
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
        }

        .pitch-player {
            align-items: center;
            background: rgba(34, 230, 255, 0.16);
            border: 1px solid rgba(34, 230, 255, 0.6);
            border-radius: 999px;
            color: var(--text);
            display: inline-flex;
            font-size: 11px;
            font-weight: 900;
            height: 30px;
            justify-content: center;
            position: absolute;
            transform: translate(-50%, -50%);
            width: 30px;
            z-index: 2;
        }

        .pitch-slot-1 { left: 50%; top: 86%; }
        .pitch-slot-2 { left: 22%; top: 65%; }
        .pitch-slot-3 { left: 40%; top: 68%; }
        .pitch-slot-4 { left: 60%; top: 68%; }
        .pitch-slot-5 { left: 78%; top: 65%; }
        .pitch-slot-6 { left: 36%; top: 48%; }
        .pitch-slot-7 { left: 64%; top: 48%; }
        .pitch-slot-8 { left: 50%; top: 30%; }

        .tactic-meta {
            color: var(--muted);
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .transfer-list,
        .news-list {
            display: grid;
            gap: 10px;
        }

        .transfer-item,
        .news-item {
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            display: grid;
            gap: 10px;
            grid-template-columns: 48px 1fr auto;
            padding: 10px;
        }

        .transfer-item img {
            border-radius: 5px;
            height: 48px;
            object-fit: cover;
            width: 48px;
        }

        .transfer-item strong,
        .news-item strong {
            color: var(--text);
            display: block;
            font-size: 14px;
        }

        .transfer-item span,
        .news-item span {
            color: var(--muted);
            display: block;
            font-size: 12px;
            margin-top: 3px;
        }

        .badge {
            background: rgba(48, 242, 156, 0.14);
            border: 1px solid rgba(48, 242, 156, 0.34);
            border-radius: 6px;
            color: var(--green);
            font-size: 12px;
            font-weight: 900;
            padding: 6px 9px;
        }

        .result-score {
            align-items: center;
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr auto 1fr;
            margin: 26px 0;
            text-align: center;
        }

        .score-number {
            color: var(--text);
            font-size: 40px;
            font-weight: 900;
            min-width: 116px;
            white-space: nowrap;
        }

        .match-result-card .score-number {
            font-size: 34px;
            min-width: 90px;
        }

        .match-result-card .match-team {
            min-width: 0;
        }

        .match-result-card .match-team strong {
            max-width: 82px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kits-row {
            align-items: end;
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            text-align: center;
        }

        .kit-item {
            margin: 0;
        }

        .club-kit {
            display: block;
            height: 122px;
            margin: 0 auto 8px;
            object-fit: contain;
            width: 122px;
        }

        .kit-item figcaption {
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
        }

        .finance-body {
            display: grid;
            gap: 18px;
            grid-template-columns: 160px 1fr;
        }

        .finance-numbers {
            display: grid;
            gap: 12px;
        }

        .finance-numbers span {
            color: var(--faint);
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .finance-numbers strong {
            color: var(--text);
            display: block;
            font-size: 21px;
            margin-top: 3px;
        }

        .chart {
            align-items: end;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            min-height: 136px;
            padding: 16px 0 0 16px;
        }

        .chart i {
            background: linear-gradient(180deg, var(--cyan), rgba(34, 230, 255, 0.12));
            border-radius: 999px 999px 0 0;
            display: block;
            flex: 1;
            min-width: 16px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .club-table {
            background: transparent;
            border-collapse: collapse;
            width: 100%;
        }

        .club-table th,
        .club-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 13px;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }

        .club-table th {
            color: var(--faint);
            font-size: 11px;
            text-transform: uppercase;
        }

        .club-table tr:hover {
            background: rgba(34, 230, 255, 0.06);
        }

        .club-table a,
        .player-name-cell a {
            color: var(--text);
        }

        .player-photo {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 5px;
            display: block;
            height: 44px;
            object-fit: cover;
            width: 44px;
        }

        .club-crest {
            height: 34px;
            object-fit: contain;
            vertical-align: middle;
            width: 34px;
        }

        .flag-list {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .flag-badge {
            display: inline-block;
            height: 16px;
            object-fit: contain;
            width: 22px;
        }

        .flag-code {
            color: var(--text);
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            min-width: 22px;
        }

        .position-badge {
            background: rgba(34, 230, 255, 0.12);
            border: 1px solid rgba(34, 230, 255, 0.28);
            border-radius: 6px;
            color: var(--cyan);
            display: inline-block;
            font-size: 12px;
            font-weight: 900;
            padding: 5px 8px;
        }

        @media (max-width: 1180px) {
            .dashboard-grid-main,
            .dashboard-grid-mid,
            .dashboard-grid-bottom,
            .app-topbar {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            :root {
                --sidebar: 0px;
            }

            .navbar {
                height: auto;
                position: static;
                width: 100%;
            }

            .container {
                margin-left: 0;
            }

            .club-dashboard {
                padding: 16px;
            }

            .overview-content,
            .overview-stats,
            .finance-body {
                grid-template-columns: 1fr;
            }

            .kits-row {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">
        <span class="brand">Web<strong>Soccer</strong></span>
        <a href="/" data-icon="Ü">Übersicht</a>
        <a href="/clubs/" data-icon="K">Kader</a>
