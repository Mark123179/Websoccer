<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>

    <style>

        :root {
            --blue-900: #00477f;
            --blue-800: #005a9f;
            --blue-700: #006fc8;
            --blue-100: #e7f3ff;
            --line: #c9d7e5;
            --muted: #526579;
            --text: #071827;
            --surface: #ffffff;
            --surface-soft: #f3f6f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: #dce7f2;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            align-items: center;
            background: linear-gradient(180deg, var(--blue-800), var(--blue-900));
            border-bottom: 3px solid #083b68;
            display: flex;
            gap: 22px;
            min-height: 42px;
            padding: 7px max(18px, calc((100vw - 1180px) / 2));
        }

        .navbar a {
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0;
            margin-right: 16px;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        .container {
            background: var(--surface);
            border-left: 1px solid #b7c7d7;
            border-right: 1px solid #b7c7d7;
            margin: 0 auto;
            max-width: 1180px;
            min-height: calc(100vh - 42px);
        }

        a {
            color: #005da8;
            font-weight: 700;
        }

        .hero {
            background: var(--surface);
            border-bottom: 4px solid var(--blue-800);
            padding: 22px 28px;
        }

        .hero h1 {
            margin: 0 0 10px;
        }

        .hero p {
            color: var(--muted);
            margin: 0;
            max-width: 760px;
        }

        .dashboard-grid {
            display: grid;
            gap: 1px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-bottom: 16px;
        }

        .panel {
            background: linear-gradient(180deg, #ffffff, #e6ebef);
            border: 1px solid var(--line);
            padding: 14px 16px;
        }

        .panel h2,
        .panel h3 {
            margin-top: 0;
        }

        .stat-value {
            color: #003f72;
            display: block;
            font-size: 24px;
            font-weight: 900;
            margin-top: 6px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .button-link {
            background: var(--blue-800);
            color: #ffffff;
            display: inline-block;
            font-weight: 900;
            padding: 9px 13px;
            text-decoration: none;
        }

        .muted {
            color: var(--muted);
        }

        .club-screen {
            background: var(--surface);
        }

        .club-hero {
            align-items: center;
            background: #ffffff;
            border-top: 4px solid var(--blue-900);
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(170px, 1fr) auto minmax(170px, 1fr);
            min-height: 174px;
            padding: 8px 34px 12px;
        }

        .club-identity {
            text-align: center;
        }

        .club-identity h1 {
            background: linear-gradient(180deg, var(--blue-800), var(--blue-900));
            color: #ffffff;
            font-size: 30px;
            font-weight: 900;
            line-height: 1.1;
            margin: -8px -36px 8px;
            padding: 4px 36px;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
        }

        .club-hero-crest {
            display: block;
            height: 122px;
            margin: 0 auto;
            object-fit: contain;
            width: 122px;
        }

        .club-link-stack {
            display: grid;
            gap: 13px;
            justify-items: center;
        }

        .club-link-stack a {
            color: #00477f;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
        }

        .club-link-stack a:hover {
            text-decoration: underline;
        }

        .info-band {
            border-bottom: 1px solid var(--line);
        }

        .info-band h2 {
            background: linear-gradient(180deg, var(--blue-800), var(--blue-900));
            color: #ffffff;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0;
            line-height: 1.15;
            margin: 0;
            padding: 3px 12px 4px;
            text-align: center;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 26px;
            padding: 0 34px 8px;
        }

        .info-row {
            align-items: center;
            display: grid;
            grid-template-columns: minmax(150px, 42%) 1fr;
            min-height: 28px;
        }

        .info-row span,
        .notable-label {
            background: linear-gradient(180deg, #eeeeee, #c8c8c8);
            color: #000000;
            display: block;
            font-size: 14px;
            font-weight: 900;
            min-height: 24px;
            padding: 4px 8px;
            text-align: center;
        }

        .info-row strong {
            color: #06213a;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px;
            text-align: center;
        }

        .notable-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .notable-row {
            align-items: center;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: minmax(160px, 36%) 46px 1fr;
            min-height: 58px;
        }

        .notable-photo {
            height: 42px;
            object-fit: cover;
            width: 42px;
        }

        .notable-row div {
            display: grid;
            gap: 2px;
            padding: 0 12px 0 4px;
        }

        .notable-row strong {
            color: #071827;
            font-size: 13px;
        }

        .split-band {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .split-panel:first-child {
            border-right: 1px solid var(--line);
        }

        .kit-strip {
            align-items: flex-end;
            display: flex;
            flex-wrap: wrap;
            gap: 36px;
            justify-content: center;
            margin: 0;
            padding: 18px 18px 20px;
        }

        .kit-item {
            margin: 0;
            text-align: center;
        }

        .kit-item figcaption {
            color: #122b44;
            font-size: 13px;
            font-weight: 900;
            margin-top: 4px;
        }

        .club-kit {
            display: block;
            height: 118px;
            object-fit: contain;
            width: 118px;
        }

        .status-list {
            display: grid;
            gap: 11px;
            padding: 18px 34px;
        }

        .status-list p {
            display: grid;
            gap: 4px;
            margin: 0;
        }

        .status-list span {
            color: #000000;
            font-weight: 900;
        }

        .status-list strong {
            color: #06213a;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .club-table {
            background-color: #ffffff;
            border-collapse: collapse;
            width: 100%;
        }

        .club-table th {
            background: linear-gradient(180deg, #f5f8fb, #ccd7e0);
            border-bottom: 1px solid #aebdca;
            color: #000000;
            font-size: 13px;
            font-weight: 900;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
        }

        .club-table td {
            border-bottom: 1px solid #d8e1ea;
            color: #071827;
            font-size: 13px;
            padding: 7px 10px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .club-table tr:hover {
            background-color: var(--blue-100);
        }

        .squad-table .player-name-cell a {
            color: #004f90;
            font-size: 14px;
            font-weight: 900;
        }

        .player-cell {
            align-items: center;
            display: flex;
            gap: 10px;
        }

        .player-photo {
            background: #e8eef5;
            border: 1px solid #8797a8;
            display: block;
            height: 46px;
            object-fit: cover;
            width: 46px;
        }

        .club-crest {
            height: 34px;
            object-fit: contain;
            vertical-align: middle;
            width: 34px;
        }

        .club-title {
            align-items: center;
            display: flex;
            gap: 12px;
            padding: 22px 28px 0;
        }

        .flag-list {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .flag-badge {
            display: inline-block;
            height: 18px;
            line-height: 1;
            object-fit: contain;
            vertical-align: middle;
            width: 24px;
        }

        .flag-code {
            color: #071827;
            display: inline-block;
            font-size: 12px;
            font-weight: 900;
            line-height: 18px;
            min-width: 24px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .navbar {
                padding: 8px 14px;
            }

            .container {
                border: 0;
            }

            .club-hero,
            .info-grid,
            .notable-grid,
            .split-band {
                grid-template-columns: 1fr;
            }

            .club-identity {
                order: -1;
            }

            .club-identity h1 {
                margin: 0 -34px 12px;
            }

            .club-link-stack {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .notable-row {
                grid-template-columns: minmax(130px, 40%) 46px 1fr;
            }

            .club-kit {
                height: 94px;
                width: 94px;
            }
        }

    </style>

</head>

<body>

    <div class="navbar">

        <span class="brand">Websoccer</span>
        <a href="/">Start</a>
        <a href="/clubs/">Vereine</a>

    </div>

    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
