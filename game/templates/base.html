<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>

    <style>

        :root {
            --ps-blue: #0070d1;
            --ps-blue-pressed: #0064b7;
            --canvas-dark: #000000;
            --surface-dark: #121314;
            --surface-dark-card: #181818;
            --canvas-light: #ffffff;
            --surface-soft: #f3f3f3;
            --surface-card: #f5f7fa;
            --hairline-light: #e5e5e5;
            --hairline-dark: rgba(229, 229, 229, 0.2);
            --ink: #000000;
            --body-light: rgba(0, 0, 0, 0.64);
            --mute-light: #6b6b6b;
            --on-dark: #ffffff;
            --body-dark: rgba(255, 255, 255, 0.72);
            --radius-card: 8px;
            --radius-pill: 9999px;
            --section-space: 64px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--canvas-dark);
            color: var(--ink);
            font-family: "Inter", "Roboto", Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            align-items: center;
            background: var(--canvas-dark);
            border-bottom: 1px solid var(--hairline-dark);
            display: flex;
            gap: 28px;
            min-height: 56px;
            padding: 0 max(24px, calc((100vw - 1280px) / 2));
        }

        .navbar a {
            color: var(--on-dark);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-decoration: none;
        }

        .navbar a:hover {
            color: #53b1ff;
        }

        .brand {
            color: var(--on-dark);
            font-size: 23px;
            font-weight: 800;
            margin-right: 8px;
        }

        .container {
            background: var(--canvas-light);
            margin: 0;
            max-width: none;
            min-height: calc(100vh - 56px);
            width: 100%;
        }

        a {
            color: var(--ps-blue-pressed);
            font-weight: 700;
        }

        .hero {
            background: var(--canvas-light);
            padding: 48px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 300;
            line-height: 1.25;
            margin: 0 0 12px;
        }

        .hero p {
            color: var(--body-light);
            font-size: 18px;
            line-height: 1.5;
            margin: 0;
            max-width: 760px;
        }

        .dashboard-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            padding: 0 48px 48px;
        }

        .panel {
            background: var(--surface-card);
            border-radius: var(--radius-card);
            padding: 24px;
        }

        .panel h2,
        .panel h3 {
            font-weight: 300;
            margin-top: 0;
        }

        .stat-value {
            color: var(--ink);
            display: block;
            font-size: 28px;
            font-weight: 300;
            margin-top: 8px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .button-link {
            background: var(--ps-blue);
            border-radius: var(--radius-pill);
            color: var(--on-dark);
            display: inline-block;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 18px;
            text-decoration: none;
        }

        .muted {
            color: var(--mute-light);
        }

        .club-screen {
            background: var(--canvas-light);
        }

        .club-hero {
            align-items: center;
            background:
                radial-gradient(circle at 50% 35%, rgba(0, 112, 209, 0.22), transparent 34%),
                linear-gradient(180deg, #121314 0%, #000000 100%);
            color: var(--on-dark);
            display: grid;
            gap: 40px;
            grid-template-columns: minmax(190px, 1fr) minmax(300px, 520px) minmax(190px, 1fr);
            min-height: 360px;
            padding: 48px;
        }

        .club-identity {
            text-align: center;
        }

        .club-identity h1 {
            color: var(--on-dark);
            font-size: 54px;
            font-weight: 300;
            line-height: 1.05;
            margin: 0 0 24px;
            text-wrap: balance;
        }

        .club-hero-crest {
            display: block;
            height: 170px;
            margin: 0 auto;
            object-fit: contain;
            width: 170px;
        }

        .club-link-stack {
            align-content: center;
            display: grid;
            gap: 12px;
        }

        .club-link-stack a {
            border: 1px solid var(--hairline-dark);
            border-radius: var(--radius-pill);
            color: var(--on-dark);
            font-size: 14px;
            font-weight: 700;
            min-height: 44px;
            padding: 12px 18px;
            text-align: center;
            text-decoration: none;
        }

        .club-link-stack a:first-child,
        .club-link-stack-right a:nth-child(2) {
            background: var(--ps-blue);
            border-color: var(--ps-blue);
        }

        .info-band {
            padding: var(--section-space) 48px;
        }

        .info-band:nth-of-type(even) {
            background: var(--surface-soft);
        }

        .info-band h2 {
            color: var(--ink);
            font-size: 35px;
            font-weight: 300;
            line-height: 1.25;
            margin: 0 auto 28px;
            max-width: 1120px;
            text-align: left;
        }

        .info-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin: 0 auto;
            max-width: 1120px;
        }

        .info-row {
            background: var(--surface-card);
            border-radius: var(--radius-card);
            display: grid;
            gap: 10px;
            min-height: 104px;
            padding: 20px;
        }

        .info-row span,
        .notable-label {
            color: var(--mute-light);
            display: block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .info-row strong {
            color: var(--ink);
            font-size: 20px;
            font-weight: 500;
            line-height: 1.2;
        }

        .notable-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin: 0 auto;
            max-width: 1120px;
        }

        .notable-row {
            background: var(--canvas-light);
            border: 1px solid var(--hairline-light);
            border-radius: var(--radius-card);
            display: grid;
            gap: 12px;
            min-height: 190px;
            padding: 18px;
        }

        .notable-photo {
            background: var(--surface-card);
            border-radius: var(--radius-card);
            height: 72px;
            object-fit: cover;
            width: 72px;
        }

        .notable-row div {
            display: grid;
            gap: 5px;
        }

        .notable-row a {
            font-size: 18px;
            line-height: 1.25;
        }

        .notable-row strong {
            color: var(--body-light);
            font-size: 15px;
            font-weight: 500;
        }

        .split-band {
            background: var(--canvas-dark);
            color: var(--on-dark);
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            padding: var(--section-space) 48px;
        }

        .split-band .info-band {
            padding: 0;
        }

        .split-band h2 {
            color: var(--on-dark);
        }

        .split-panel {
            background: var(--surface-dark-card);
            border-radius: var(--radius-card);
            padding: 28px;
        }

        .kit-strip {
            align-items: flex-end;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            margin: 0;
        }

        .kit-item {
            margin: 0;
            text-align: center;
        }

        .kit-item figcaption {
            color: var(--body-dark);
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
        }

        .club-kit {
            display: block;
            height: 132px;
            object-fit: contain;
            width: 132px;
        }

        .status-list {
            display: grid;
            gap: 18px;
        }

        .status-list p {
            display: grid;
            gap: 5px;
            margin: 0;
        }

        .status-list span {
            color: var(--body-dark);
            font-size: 14px;
            font-weight: 700;
        }

        .status-list strong {
            color: var(--on-dark);
            font-size: 18px;
            font-weight: 400;
        }

        .table-wrap {
            margin: 0 auto;
            max-width: 1120px;
            overflow-x: auto;
        }

        .club-table {
            background-color: var(--canvas-light);
            border-collapse: collapse;
            width: 100%;
        }

        .club-table th {
            border-bottom: 1px solid var(--hairline-light);
            color: var(--mute-light);
            font-size: 12px;
            font-weight: 700;
            padding: 12px 10px;
            text-align: left;
            white-space: nowrap;
        }

        .club-table td {
            border-bottom: 1px solid var(--hairline-light);
            color: var(--ink);
            font-size: 14px;
            padding: 10px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .club-table tr:hover {
            background-color: #eef7ff;
        }

        .squad-table .player-name-cell a {
            color: var(--ps-blue-pressed);
            font-size: 15px;
            font-weight: 700;
        }

        .player-cell {
            align-items: center;
            display: flex;
            gap: 10px;
        }

        .player-photo {
            background: var(--surface-card);
            border: 1px solid var(--hairline-light);
            border-radius: 4px;
            display: block;
            height: 48px;
            object-fit: cover;
            width: 48px;
        }

        .club-crest {
            height: 34px;
            object-fit: contain;
            vertical-align: middle;
            width: 34px;
        }

        .club-title {
            align-items: center;
            display: flex;
            gap: 12px;
            padding: 48px 48px 0;
        }

        .flag-list {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .flag-badge {
            display: inline-block;
            height: 18px;
            line-height: 1;
            object-fit: contain;
            vertical-align: middle;
            width: 24px;
        }

        .flag-code {
            color: var(--ink);
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            line-height: 18px;
            min-width: 24px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .club-hero,
            .info-grid,
            .notable-grid,
            .split-band {
                grid-template-columns: 1fr;
            }

            .club-identity {
                order: -1;
            }

            .club-identity h1 {
                font-size: 38px;
            }

            .club-link-stack {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .navbar,
            .club-hero,
            .info-band,
            .split-band,
            .hero {
                padding-left: 24px;
                padding-right: 24px;
            }

            .club-link-stack {
                grid-template-columns: 1fr;
            }

            .club-hero-crest {
                height: 132px;
                width: 132px;
            }

            .club-kit {
                height: 104px;
                width: 104px;
            }
        }

    </style>

</head>

<body>

    <div class="navbar">

        <span class="brand">Websoccer</span>
        <a href="/">Start</a>
        <a href="/clubs/">Vereine</a>

    </div>

    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
