<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>

    <style>

        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #111;
            padding: 15px 30px;
            border-bottom: 3px solid #00bfff;

            display: flex;
            gap: 20px;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #00bfff;
        }

        .brand {
            color: #00bfff;
            font-size: 18px;
            font-weight: 800;
            margin-right: 16px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            max-width: 1180px;
        }

        a {
            color: #00bfff;
        }

        .hero {
            background: linear-gradient(135deg, #111 0%, #173241 100%);
            border: 1px solid #333;
            padding: 28px;
            margin-bottom: 24px;
        }

        .hero h1 {
            margin: 0 0 10px;
        }

        .hero p {
            color: #d6d6d6;
            margin: 0;
            max-width: 760px;
        }

        .dashboard-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-bottom: 24px;
        }

        .panel {
            background-color: #2a2a2a;
            border: 1px solid #3f3f3f;
            padding: 18px;
        }

        .panel h2,
        .panel h3 {
            margin-top: 0;
        }

        .stat-value {
            color: #00bfff;
            display: block;
            font-size: 28px;
            font-weight: 800;
            margin-top: 8px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .button-link {
            background-color: #00bfff;
            color: #061018;
            display: inline-block;
            font-weight: 800;
            padding: 10px 14px;
            text-decoration: none;
        }

        .muted {
            color: #b8b8b8;
        }

        .club-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2a2a2a;
        }

        .club-table th {
            background-color: #00bfff;
            color: black;
            padding: 12px;
            text-align: left;
        }

        .club-table td {
            padding: 12px;
            border-bottom: 1px solid #444;
        }

        .club-table tr:hover {
            background-color: #3a3a3a;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <span class="brand">Websoccer</span>
        <a href="/">Start</a>
        <a href="/clubs/">Vereine</a>

    </div>

    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
