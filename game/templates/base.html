{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'game/images/brand/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="256x256" href="{% static 'game/images/brand/matchengine-logo-256.png' %}">

    <style>

        :root {
            --app-bg: #03070c;
            --stadium-bg: #07111a;
            --panel: rgba(9, 23, 34, 0.82);
            --panel-strong: rgba(12, 31, 45, 0.94);
            --panel-soft: rgba(17, 43, 58, 0.72);
            --line: rgba(44, 231, 255, 0.18);
            --line-strong: rgba(44, 231, 255, 0.38);
            --cyan: #22e6ff;
            --cyan-soft: rgba(34, 230, 255, 0.14);
            --green: #30f29c;
            --yellow: #ffd166;
            --red: #ff5570;
            --text: #f4fbff;
            --muted: rgba(244, 251, 255, 0.64);
            --faint: rgba(244, 251, 255, 0.38);
            --dark-text: #061018;
            --radius: 8px;
            --shadow: 0 18px 70px rgba(0, 0, 0, 0.46);
            --glow: 0 0 28px rgba(34, 230, 255, 0.18);
            --sidebar: 232px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 74% 8%, rgba(34, 230, 255, 0.14), transparent 24%),
                radial-gradient(circle at 40% 110%, rgba(48, 242, 156, 0.12), transparent 28%),
                linear-gradient(135deg, #02050a 0%, #07121d 48%, #02050a 100%);
            color: var(--text);
            font-family: Inter, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 0;
        }

        body::before {
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 56px 56px;
            content: "";
            inset: 0;
            pointer-events: none;
            position: fixed;
            z-index: -1;
        }

        a {
            color: var(--cyan);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            color: #8ff5ff;
        }

        .navbar {
            background:
                linear-gradient(180deg, rgba(3, 11, 18, 0.98), rgba(3, 9, 15, 0.94)),
                radial-gradient(circle at 80% 10%, rgba(34, 230, 255, 0.14), transparent 34%);
            border-right: 1px solid var(--line);
            box-shadow: 12px 0 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100vh;
            left: 0;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            width: var(--sidebar);
            z-index: 10;
        }

        .brand {
            align-items: center;
            color: var(--text);
            display: flex;
            font-size: 23px;
            font-weight: 900;
            gap: 11px;
            margin-bottom: 24px;
        }

        .brand-logo {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), rgba(34, 230, 255, 0.06));
            border: 1px solid var(--line-strong);
            border-radius: 10px;
            box-shadow: var(--glow);
            display: block;
            height: 48px;
            object-fit: contain;
            padding: 2px;
            width: 48px;
        }

        .brand strong {
            color: var(--cyan);
        }

        .navbar a {
            align-items: center;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--muted);
            display: flex;
            font-size: 15px;
            font-weight: 700;
            gap: 12px;
            min-height: 46px;
            padding: 0 14px;
        }

        .nav-icon {
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: var(--cyan);
            display: inline-flex;
            height: 26px;
            justify-content: center;
            padding: 4px;
            width: 26px;
        }

        .nav-icon img {
            display: block;
            filter: invert(79%) sepia(78%) saturate(1534%) hue-rotate(142deg) brightness(105%) contrast(103%);
            height: 18px;
            width: 18px;
        }

        .navbar a:first-of-type {
            background: linear-gradient(90deg, rgba(34, 230, 255, 0.2), rgba(34, 230, 255, 0.06));
            border-color: var(--line-strong);
            color: var(--text);
            box-shadow: inset 3px 0 0 var(--cyan);
        }

        .sidebar-profile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-top: auto;
            padding: 14px;
        }

        .sidebar-profile span {
            color: var(--muted);
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .sidebar-profile strong {
            color: var(--text);
            display: block;
            font-size: 15px;
        }

        .container {
            margin-left: var(--sidebar);
            min-height: 100vh;
        }

        .hero {
            padding: 44px;
        }

        .hero h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .hero p {
            color: var(--muted);
            margin: 0;
        }

        .dashboard-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            padding: 0 44px 44px;
        }

        .panel,
        .dashboard-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel {
            padding: 20px;
        }

        .panel h2,
        .panel h3 {
            margin-top: 0;
        }

        .stat-value {
            color: var(--cyan);
            display: block;
            font-size: 28px;
            font-weight: 900;
            margin-top: 8px;
        }

        .muted {
            color: var(--muted);
        }

        .button-link,
        .primary-action,
        .card-action {
            background: linear-gradient(180deg, #1bd9ee, #06879a);
            border: 1px solid rgba(93, 249, 255, 0.46);
            border-radius: var(--radius);
            color: #ffffff;
            display: inline-flex;
            font-size: 14px;
            font-weight: 800;
            justify-content: center;
            min-height: 42px;
            padding: 11px 18px;
            text-decoration: none;
        }

        .club-dashboard {
            background:
                linear-gradient(rgba(2, 7, 12, 0.72), rgba(2, 7, 12, 0.96)),
                radial-gradient(circle at 55% 0%, rgba(40, 215, 255, 0.2), transparent 26%),
                linear-gradient(120deg, rgba(8, 26, 37, 0.9), rgba(4, 10, 16, 0.96));
            min-height: 100vh;
            padding: 20px 28px 28px;
            position: relative;
        }

        .start-dashboard,
        .list-dashboard,
        .player-dashboard {
            background:
                linear-gradient(rgba(2, 7, 12, 0.76), rgba(2, 7, 12, 0.96)),
                radial-gradient(circle at 62% 0%, rgba(34, 230, 255, 0.2), transparent 26%),
                radial-gradient(circle at 18% 100%, rgba(48, 242, 156, 0.13), transparent 28%),
                linear-gradient(120deg, rgba(6, 21, 31, 0.92), rgba(4, 10, 16, 0.98));
            min-height: 100vh;
            padding: 20px 28px 28px;
            position: relative;
        }

        .club-dashboard::before {
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.34), transparent 5%),
                radial-gradient(ellipse at 20% 15%, rgba(255, 255, 255, 0.16), transparent 12%),
                radial-gradient(ellipse at 80% 18%, rgba(255, 255, 255, 0.14), transparent 13%),
                linear-gradient(180deg, rgba(20, 140, 78, 0.18), transparent 42%);
            content: "";
            inset: 0;
            opacity: 0.8;
            pointer-events: none;
            position: absolute;
        }

        .club-dashboard > * {
            position: relative;
            z-index: 1;
        }

        .start-dashboard::before,
        .list-dashboard::before,
        .player-dashboard::before {
            background:
                radial-gradient(ellipse at 48% 0%, rgba(255, 255, 255, 0.28), transparent 5%),
                linear-gradient(180deg, rgba(20, 140, 78, 0.16), transparent 42%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 82px);
            content: "";
            inset: 0;
            opacity: 0.82;
            pointer-events: none;
            position: absolute;
        }

        .start-dashboard > *,
        .list-dashboard > *,
        .player-dashboard > * {
            position: relative;
            z-index: 1;
        }

        .app-topbar {
            align-items: center;
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(260px, 1fr) minmax(280px, 420px) auto auto 170px;
            margin-bottom: 18px;
        }

        .home-topbar,
        .page-topbar {
            align-items: center;
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(270px, 1fr) minmax(280px, 420px) auto auto 170px;
            margin-bottom: 18px;
        }

        .control-room-title {
            align-items: center;
            display: flex;
            gap: 14px;
        }

        .control-mark {
            align-items: center;
            border: 2px solid var(--cyan);
            border-radius: 10px;
            box-shadow: var(--glow);
            color: var(--cyan);
            display: inline-flex;
            font-size: 16px;
            font-weight: 900;
            height: 56px;
            justify-content: center;
            width: 56px;
        }

        .control-logo {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), rgba(34, 230, 255, 0.06));
            color: transparent;
            font-size: 0;
            overflow: hidden;
            padding: 2px;
        }

        .control-logo img {
            display: block;
            height: 100%;
            object-fit: contain;
            width: 100%;
        }

        .control-room-title h1 {
            color: var(--text);
            font-size: 27px;
            line-height: 1.05;
            margin: 0;
        }

        .control-room-title span:not(.control-mark) {
            color: var(--muted);
            display: block;
            font-size: 13px;
            margin-top: 5px;
        }

        .club-switcher {
            align-items: center;
            display: flex;
            gap: 14px;
        }

        .club-switcher img {
            height: 58px;
            object-fit: contain;
            width: 58px;
        }

        .club-switcher h1 {
            color: var(--text);
            font-size: 25px;
            line-height: 1.1;
            margin: 0;
        }

        .club-switcher span,
        .top-date span {
            color: var(--muted);
            display: block;
            font-size: 13px;
            margin-top: 4px;
        }

        .search-box {
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--faint);
            display: flex;
            min-height: 48px;
            padding: 0 16px;
        }

        .top-icons {
            align-items: center;
            display: flex;
            gap: 12px;
        }

        .top-icon {
            align-items: center;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--muted);
            display: inline-flex;
            height: 42px;
            justify-content: center;
            position: relative;
            width: 42px;
        }

        .top-icon span {
            align-items: center;
            background: var(--cyan);
            border-radius: 999px;
            color: var(--dark-text);
            display: inline-flex;
            font-size: 11px;
            font-weight: 900;
            height: 18px;
            justify-content: center;
            position: absolute;
            right: -6px;
            top: -7px;
            width: 18px;
        }

        .top-date {
            color: var(--text);
            font-size: 14px;
            line-height: 1.2;
            min-width: 116px;
        }

        .dashboard-grid-main {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.1fr 1.05fr 1fr;
        }

        .dashboard-grid-mid {
            display: grid;
            gap: 16px;
            grid-template-columns: 0.9fr 0.9fr 0.95fr 0.8fr;
            margin-top: 16px;
        }

        .dashboard-grid-bottom {
            display: grid;
            gap: 16px;
            grid-template-columns: 0.9fr 1fr 1.15fr;
            margin-top: 16px;
        }

        .start-grid-main {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.2fr 0.86fr 0.9fr;
        }

        .start-kpi-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            margin-top: 16px;
        }

        .home-grid-two {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.35fr 0.86fr;
            margin-top: 16px;
        }

        .home-grid-bottom {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.15fr 0.82fr 0.9fr;
            margin-top: 16px;
        }

        .clubs-kpi-grid,
        .player-kpi-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-bottom: 16px;
        }

        .clubs-layout-grid {
            align-items: start;
            display: grid;
            gap: 16px;
            grid-template-columns: 1.35fr 0.8fr;
        }

        .player-layout-grid {
            align-items: start;
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 0.82fr;
        }

        .card-title {
            color: var(--text);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.4px;
            margin: 0 0 14px;
            text-transform: uppercase;
        }

        .club-overview-card,
        .next-match-card,
        .league-table-card,
        .squad-preview-card,
        .tactics-card,
        .transfer-card,
        .match-result-card,
        .kits-card,
        .news-card,
        .finance-card,
        .start-hero-card,
        .start-match-card,
        .readiness-card,
        .kpi-card,
        .start-table-card,
        .player-radar-card,
        .finance-command-card,
        .strength-command-card,
        .sprint-card,
        .clubs-table-card,
        .clubs-radar-card,
        .player-hero-card,
        .player-profile-card,
        .player-context-card {
            padding: 18px;
        }

        .club-overview-card,
        .next-match-card,
        .match-result-card,
        .start-hero-card,
        .start-match-card,
        .clubs-radar-card,
        .player-hero-card {
            background:
                linear-gradient(rgba(7, 20, 31, 0.88), rgba(5, 15, 23, 0.9)),
                radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.16), transparent 22%);
        }

        .start-hero-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 334px;
        }

        .system-label {
            color: var(--cyan);
            display: block;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .hero-content h2 {
            color: var(--text);
            font-size: 40px;
            line-height: 1.06;
            margin: 0 0 14px;
            max-width: 620px;
        }

        .hero-content p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.55;
            margin: 0;
            max-width: 760px;
        }

        .start-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .start-actions .card-action {
            margin-top: 0;
            width: auto;
        }

        .secondary-action {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--line);
            color: var(--text);
        }

        .hero-signal-grid {
            border-top: 1px solid var(--line);
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            margin-top: 22px;
            padding-top: 16px;
        }

        .hero-signal-grid span,
        .kpi-card span,
        .readiness-list span {
            color: var(--faint);
            display: block;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .hero-signal-grid strong,
        .kpi-card strong {
            color: var(--text);
            display: block;
            font-size: 18px;
            line-height: 1.25;
            margin-top: 6px;
        }

        .kpi-card {
            min-height: 108px;
        }

        .kpi-card strong {
            color: var(--cyan);
            font-size: 24px;
        }

        .readiness-list,
        .player-radar-list,
        .strength-list,
        .sprint-list {
            display: grid;
            gap: 12px;
        }

        .readiness-list div {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 12px;
        }

        .readiness-list strong {
            color: var(--text);
            display: block;
            font-size: 14px;
            margin: 5px 0 10px;
        }

        .readiness-list i {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            display: block;
            height: 7px;
            overflow: hidden;
            position: relative;
        }

        .readiness-list i::before {
            background: linear-gradient(90deg, var(--green), var(--cyan));
            border-radius: inherit;
            content: "";
            inset: 0 auto 0 0;
            position: absolute;
            width: var(--bar);
        }

        .section-head {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-head .card-title {
            margin: 0;
        }

        .club-name-cell {
            align-items: center;
            display: inline-flex;
            gap: 10px;
        }

        .radar-player {
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            color: var(--text);
            display: grid;
            gap: 12px;
            grid-template-columns: 46px 1fr auto;
            padding: 10px;
        }

        .radar-player img {
            border-radius: 5px;
            height: 46px;
            object-fit: cover;
            width: 46px;
        }

        .radar-player strong,
        .sprint-list strong {
            color: var(--text);
            display: block;
            font-size: 14px;
        }

        .radar-player small,
        .sprint-list span {
            color: var(--muted);
            display: block;
            font-size: 12px;
            margin-top: 3px;
        }

        .radar-player em {
            background: rgba(48, 242, 156, 0.12);
            border: 1px solid rgba(48, 242, 156, 0.28);
            border-radius: 6px;
            color: var(--green);
            font-size: 12px;
            font-style: normal;
            font-weight: 900;
            padding: 7px 9px;
            white-space: nowrap;
        }

        .strength-list div {
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .strength-list span {
            color: var(--text);
            font-weight: 800;
        }

        .strength-list strong {
            align-items: center;
            background: rgba(34, 230, 255, 0.14);
            border: 1px solid rgba(34, 230, 255, 0.38);
            border-radius: 999px;
            color: var(--cyan);
            display: inline-flex;
            height: 34px;
            justify-content: center;
            min-width: 34px;
        }

        .sprint-list div {
            border-left: 3px solid var(--cyan);
            padding: 2px 0 2px 12px;
        }

        .page-intro {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
            margin: 0;
            max-width: 780px;
        }

        .club-radar-list,
        .detail-list {
            display: grid;
            gap: 12px;
        }

        .club-radar-item {
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            color: var(--text);
            display: grid;
            gap: 12px;
            grid-template-columns: 46px 1fr auto;
            padding: 11px;
        }

        .club-radar-item img {
            height: 46px;
            object-fit: contain;
            width: 46px;
        }

        .club-radar-item strong,
        .detail-list strong {
            color: var(--text);
            display: block;
            font-size: 14px;
        }

        .club-radar-item span,
        .detail-list span {
            color: var(--muted);
            display: block;
            font-size: 12px;
            margin-top: 3px;
        }

        .value-pill {
            background: rgba(48, 242, 156, 0.12);
            border: 1px solid rgba(48, 242, 156, 0.28);
            border-radius: 6px;
            color: var(--green);
            font-size: 12px;
            font-weight: 900;
            padding: 7px 9px;
            white-space: nowrap;
        }

        .player-identity {
            align-items: center;
            display: grid;
            gap: 22px;
            grid-template-columns: 132px 1fr;
        }

        .player-portrait-large {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: var(--radius);
            height: 132px;
            object-fit: cover;
            width: 132px;
        }

        .player-identity h2 {
            color: var(--text);
            font-size: 32px;
            line-height: 1.08;
            margin: 0 0 10px;
        }

        .player-identity-meta {
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-bottom: 16px;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .profile-actions .card-action {
            margin-top: 0;
            width: auto;
        }

        .detail-list div {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 12px;
        }

        .overview-content {
            align-items: center;
            display: grid;
            gap: 20px;
            grid-template-columns: 150px 1fr;
        }

        .overview-crest,
        .match-crest {
            filter: drop-shadow(0 0 18px rgba(34, 230, 255, 0.28));
            height: 136px;
            object-fit: contain;
            width: 136px;
        }

        .match-result-card .match-crest {
            height: 70px;
            width: 70px;
        }

                repeating-linear-gradient(150deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px),

        .player-card-stage::before {

            background:
                linear-gradient(180deg, rgba(166, 234, 232, 0.42) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, transparent 49.7%, rgba(156, 221, 229, 0.5) 49.7% 50.3%, transparent 50.3%),
                radial-gradient(circle at 50% 50%, rgba(116, 224, 223, 0.16), transparent 28%),
                repeating-linear-gradient(90deg, rgba(76, 144, 106, 0.34) 0, rgba(76, 144, 106, 0.34) 54px, rgba(32, 83, 70, 0.34) 54px, rgba(32, 83, 70, 0.34) 108px),

            overflow: visible;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            background:
                linear-gradient(0deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px),

            fill: none;
            stroke: #18e0e3;
            stroke-width: 2.6;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 0 8px rgba(24, 224, 227, 0.45));
        }

        .market-chart i {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22eff0;
            box-shadow: 0 0 0 2px rgba(2, 17, 28, 0.96), 0 0 14px rgba(34, 239, 240, 0.7);
            transform: translate(-50%, -50%);
            cursor: default;
        }

        .market-point-label {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 9px);
            z-index: 5;
            min-width: max-content;
            padding: 5px 8px;
            border: 1px solid rgba(88, 238, 236, 0.42);
            border-radius: 5px;
            color: #eaffff;
            background: rgba(2, 13, 21, 0.96);
            font-size: 11px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(4px);
            transition: opacity 120ms ease, transform 120ms ease;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
        }

        .market-chart i:hover .market-point-label,
        .market-chart i:focus .market-point-label {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .market-chart i.is-edge-start .market-point-label {
            left: 0;
            transform: translateX(0) translateY(4px);
        }

        .market-chart i.is-edge-start:hover .market-point-label,
        .market-chart i.is-edge-start:focus .market-point-label {
            transform: translateX(0) translateY(0);
        }

        .market-chart i.is-edge-end .market-point-label {
            right: 0;
            left: auto;
            transform: translateX(0) translateY(4px);
        }

        .market-chart i.is-edge-end:hover .market-point-label,
        .market-chart i.is-edge-end:focus .market-point-label {
            transform: translateX(0) translateY(0);
        }

        .market-axis-x {
            position: relative;
            grid-column: 2;
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
        }

        .market-axis-x small {
            position: absolute;
            left: -48px;
            top: 2px;
        }

        .market-axis-x span {
            position: absolute;
            top: 4px;
            transform: translateX(-50%) rotate(-38deg);
            transform-origin: top center;
            width: auto;
            white-space: nowrap;
            color: rgba(224, 242, 246, 0.78);
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.72);
        }

        .market-axis-x span:nth-of-type(even) {
            top: 16px;
        }

        .transfer-history-list {
            display: grid;
            gap: 0;
        }

        .transfer-history-row {
            display: grid;
            grid-template-columns: 82px 1fr minmax(92px, auto);
            gap: 10px;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.075);
            color: var(--text);
            font-size: 12px;
        }

        .transfer-history-row:last-child {
            border-bottom: 0;
        }

        .transfer-history-row time,
        .transfer-history-row small {
            color: var(--muted);
        }

        .transfer-history-row small {
            justify-self: end;
            text-align: right;
        }

        .transfer-clubs {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
        }

        .transfer-clubs span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transfer-clubs img {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            object-fit: contain;
        }

        .transfer-clubs b {
            color: var(--accent);
            font-weight: 900;
            text-align: center;
        }

        .timeline-list.compact {
            display: grid;
            gap: 0;
        }

        .timeline-list.compact div {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            min-height: 31px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.075);
            border-left: 0;
            font-size: 12px;
            padding-left: 0;
        }

        .timeline-list.compact div:last-child {
            border-bottom: 0;
        }

        .timeline-list.compact time,
        .timeline-list.compact span {
            color: var(--muted);
        }

        .timeline-list.compact strong {
            color: var(--text);
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .trophy-panel {
            min-height: 204px;
        }

        .trophy-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(72px, 86px));
            justify-content: center;
            gap: 10px 14px;
            max-height: 148px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .trophy-list figure {
            display: grid;
            justify-items: center;
            gap: 8px;
            margin: 0;
            min-width: 0;
        }

        .trophy-list img {
            width: 62px;
            height: 62px;
            object-fit: contain;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.44));
        }

        .trophy-list figcaption {
            display: grid;
            gap: 2px;
            max-width: 100%;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
        }

        .trophy-list figcaption strong {
            color: var(--text);
            font-size: 17px;
            line-height: 1;
        }

        .empty-copy {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 1700px) {
            .player-profile-grid {
                grid-template-columns: minmax(250px, 300px) minmax(560px, 1fr) minmax(380px, 0.86fr);
            }

            .player-card-stage {
                height: 274px;
            }

            .player-profile-portrait {
                top: 34px;
                width: 190px;
                height: 190px;
            }

            .player-side-grid {
                grid-template-columns: 1fr;
            }

            .timeline-list.compact div {
                grid-template-columns: 74px 1fr auto;
            }
        }

        @media (max-width: 1450px) {
            .player-profile-grid {
                grid-template-columns: minmax(250px, 290px) minmax(0, 1fr);
            }

            .player-profile-side {
                grid-column: 1 / -1;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .player-market-panel,
            .trophy-panel {
                grid-column: auto;
            }

            .player-side-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1180px) {
            .player-profile-grid,
            .player-profile-side {
                grid-template-columns: 1fr;
            }

            .player-identity-panel {
                position: static;
                margin-top: 0;
            }

            .player-card-stage {
                height: 292px;
            }

            .transfer-history-row {
                grid-template-columns: 76px 1fr;
            }

            .transfer-history-row small {
                grid-column: 2;
                justify-self: start;
                text-align: left;
            }
        }

    </style>

</head>
