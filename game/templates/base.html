{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Websoccer
        {% endblock %}
    </title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'game/images/brand/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="256x256" href="{% static 'game/images/brand/matchengine-logo-256.png' %}">
    <link rel="stylesheet" href="{% static 'game/css/global-dashboard.css' %}">

    {% block extra_css %}{% endblock %}

</head>

<body>

    <nav class="navbar">
        <span class="brand">
            <img class="brand-logo" src="{% static 'game/images/brand/matchengine-logo-128.png' %}" alt="MatchEngine Logo">
            <span>Match<strong>Engine</strong></span>
        </span>

        <a href="/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/uebersicht.svg' %}" alt=""></span>
            Übersicht
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/kader.svg' %}" alt=""></span>
            Kader
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/taktik.svg' %}" alt=""></span>
            Taktik
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/training.svg' %}" alt=""></span>
            Training
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/transfers.svg' %}" alt=""></span>
            Transfers
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/scouting.svg' %}" alt=""></span>
            Scouting
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/jugend.svg' %}" alt=""></span>
            Jugend
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/finanzen.svg' %}" alt=""></span>
            Finanzen
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/verein.svg' %}" alt=""></span>
            Verein
        </a>
        <a href="/admin/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/mitarbeiter.svg' %}" alt=""></span>
            Mitarbeiter
        </a>
        <a href="/clubs/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/wettbewerbe.svg' %}" alt=""></span>
            Wettbewerbe
        </a>
        <a href="/admin/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/posteingang.svg' %}" alt=""></span>
            Posteingang
        </a>
        <a href="/admin/">
            <span class="nav-icon"><img src="{% static 'game/images/icons/sidebar/einstellungen.svg' %}" alt=""></span>
            Einstellungen
        </a>


        <div class="sidebar-profile">
            <span>Manager</span>
            <strong>Creator Mode</strong>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
