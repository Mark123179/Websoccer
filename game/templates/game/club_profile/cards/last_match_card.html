{% load static %}

<article class="club-profile-card club-facilities-card last-match-profile-card">
    <h2 class="club-card-title">VEREINSUMFELD</h2>

    <div class="club-facilities-list">
        {% for f in profile.facilities %}
        <div class="club-facility-row">
            <span class="club-facility-label">{{ f.fullLabel }}</span>
            <div class="club-facility-pips">
                <div class="club-facility-pip{% if f.level >= 1 %} club-facility-pip--active{% endif %}"></div>
                <div class="club-facility-pip{% if f.level >= 2 %} club-facility-pip--active{% endif %}"></div>
                <div class="club-facility-pip{% if f.level >= 3 %} club-facility-pip--active{% endif %}"></div>
            </div>
            <span class="club-facility-level">Stufe {{ f.level }}</span>
        </div>
        {% endfor %}
    </div>

    <a class="club-profile-button club-facilities-action" href="/management/stadion/">
        Stadionverwaltung
        <span aria-hidden="true">→</span>
    </a>
</article>
