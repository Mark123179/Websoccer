{% load static %}

<article class="club-profile-card kits-profile-card">
    <h2 class="club-card-title">TRIKOTS</h2>

    <div class="club-kits-row">
        <figure>
            {% if profile.kits.homeImageUrl %}
                <img src="{{ profile.kits.homeImageUrl }}" alt="Heimtrikot">
            {% endif %}
            <figcaption>Heim</figcaption>
        </figure>
        <figure>
            {% if profile.kits.awayImageUrl %}
                <img src="{{ profile.kits.awayImageUrl }}" alt="Auswärtstrikot">
            {% endif %}
            <figcaption>Auswärts</figcaption>
        </figure>
        <figure>
            {% if profile.kits.thirdImageUrl %}
                <img src="{{ profile.kits.thirdImageUrl }}" alt="Drittes Trikot">
            {% endif %}
            <figcaption>Drittes</figcaption>
        </figure>
    </div>
</article>
