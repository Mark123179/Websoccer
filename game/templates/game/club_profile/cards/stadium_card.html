{% load static %}

<article class="club-profile-card image-profile-card stadium-profile-card">
    {% if profile.stadium.imageUrl %}
        <img src="{{ profile.stadium.imageUrl }}" alt="{{ profile.stadium.name }}">
    {% endif %}
    <div class="image-card-top">
        <h2 class="club-card-title">STADION</h2>
        <strong>{{ profile.stadium.name }}</strong>
    </div>
    <div class="stadium-card-metrics">
        <span class="club-image-metric">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 19V9l8-5 8 5v10"></path>
                <path d="M7 19v-7h10v7"></path>
                <path d="M10 19v-4h4v4"></path>
            </svg>
            <span>
                <small>Kapazität</small>
                <strong>{{ profile.stadium.capacityFormatted }}</strong>
            </span>
        </span>
        <span class="club-image-metric">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 14a8 8 0 0 1 16 0"></path>
                <path d="m12 14 4-5"></path>
                <path d="M8 20h8"></path>
            </svg>
            <span>
                <small>Auslastung</small>
                <strong>{{ profile.stadium.averageAttendanceFormatted }} · {{ profile.stadium.utilizationFormatted }}</strong>
            </span>
        </span>
    </div>
</article>
