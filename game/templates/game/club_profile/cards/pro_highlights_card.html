<article class="club-profile-card pro-highlights-card">
    <h2 class="club-card-title">PROFI-HIGHLIGHTS</h2>

    <div class="club-player-grid is-pro">
        {% for item in profile.proHighlights %}
            {% include 'game/club_profile/cards/player_highlight_tile.html' with item=item compact=False %}
        {% endfor %}
    </div>

    <a class="club-profile-button" href="{{ profile.links.professionalSquadUrl }}">
        Vollständiger Kader ({{ profile.club.proPlayerCount }})
        <span aria-hidden="true">→</span>
    </a>
</article>
