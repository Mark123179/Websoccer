<article class="club-profile-card youth-highlights-card">
    <h2 class="club-card-title">JUGEND-HIGHLIGHTS</h2>

    <div class="club-player-grid is-youth">
        {% for item in profile.youthHighlights %}
            {% include 'game/club_profile/cards/player_highlight_tile.html' with item=item compact=True %}
        {% endfor %}
    </div>

    <a class="club-profile-button" href="{{ profile.links.youthSquadUrl }}">
        Vollständiger Kader ({{ profile.club.youthPlayerCount }})
        <span aria-hidden="true">→</span>
    </a>
</article>
