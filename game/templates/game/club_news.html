{% extends 'base.html' %}
{% load static %}

{% block title %}Vereinsnews – {{ club.name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'game/css/vereinsnews.css' %}?v=9">
{% endblock %}

{% block content %}
{{ vn_data|json_script:"vn-data" }}
<script>
window.VN_DATA = JSON.parse(document.getElementById('vn-data').textContent);
window.VN_DATA.csrf = '{{ csrf_token }}';
</script>
<div id="vereinsnews-app"></div>
{% endblock %}

{% block extra_js %}
<script>window.wsDefaultPlayerUrl='{{ default_player_url }}';</script>
<script src="{% static 'game/js/vereinsnews.js' %}?v=12"></script>
{% endblock %}
