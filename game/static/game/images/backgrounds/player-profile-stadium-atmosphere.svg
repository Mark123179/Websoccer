    <rect x="102" y="196" width="20" height="12" rx="3" fill="#f1fdff"/>
    <rect x="128" y="204" width="20" height="12" rx="3" fill="#f1fdff"/>
    <rect x="154" y="212" width="20" height="12" rx="3" fill="#f1fdff"/>
    <rect x="1360" y="212" width="20" height="12" rx="3" fill="#f1fdff"/>
    <rect x="1386" y="204" width="20" height="12" rx="3" fill="#f1fdff"/>
    <rect x="1412" y="196" width="20" height="12" rx="3" fill="#f1fdff"/>
