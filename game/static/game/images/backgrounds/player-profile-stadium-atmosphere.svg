    <path d="M1340 210 L1512 450" stroke="#8ed8ff" stroke-width="1.4"/>
    <path d="M222 292 C470 172 1066 172 1314 292" fill="none" stroke="#94d9ff" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>

  <rect width="1536" height="1024" fill="url(#vignette)" opacity="0.82"/>
  <rect width="1536" height="1024" fill="#000000" opacity="0.18"/>
