  <rect width="1536" height="1024" fill="url(#leftLight)"/>
  <rect width="1536" height="1024" fill="url(#rightLight)"/>

  <g opacity="0.44">
    <path d="M0 456 C356 368 1180 368 1536 456 L1536 560 C1124 498 412 498 0 560 Z" fill="#071118"/>
    <path d="M0 492 C440 430 1096 430 1536 492" stroke="#1d85d6" stroke-opacity="0.48" stroke-width="5"/>
    <path d="M0 536 C440 486 1096 486 1536 536" stroke="#1c6da9" stroke-opacity="0.34" stroke-width="4"/>
  </g>

  <g opacity="0.46">
    <circle cx="82" cy="450" r="1.2" fill="#ffc36b"/>
    <circle cx="168" cy="420" r="1.1" fill="#ffc36b"/>
    <circle cx="263" cy="460" r="1" fill="#7ecaff"/>
    <circle cx="1310" cy="452" r="1.2" fill="#ffc36b"/>
    <circle cx="1408" cy="430" r="1.1" fill="#ffc36b"/>
    <circle cx="1218" cy="468" r="1" fill="#7ecaff"/>
