<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Cinematic stadium background">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#020711"/>
      <stop offset="0.34" stop-color="#071b31"/>
      <stop offset="0.66" stop-color="#071824"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <radialGradient id="moonCloud" cx="0.5" cy="0.16" r="0.52">
      <stop offset="0" stop-color="#87c7ff" stop-opacity="0.18"/>
      <stop offset="0.32" stop-color="#2f76ac" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#020711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pitchGlow" cx="0.5" cy="0.72" r="0.46">
      <stop offset="0" stop-color="#81ff8b" stop-opacity="0.38"/>
      <stop offset="0.28" stop-color="#32a957" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#06180e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftLight" cx="0.08" cy="0.23" r="0.28">
      <stop offset="0" stop-color="#e9fbff" stop-opacity="0.9"/>
      <stop offset="0.1" stop-color="#9ddcff" stop-opacity="0.36"/>
      <stop offset="0.58" stop-color="#2aa8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightLight" cx="0.92" cy="0.23" r="0.28">
      <stop offset="0" stop-color="#e9fbff" stop-opacity="0.9"/>
      <stop offset="0.1" stop-color="#9ddcff" stop-opacity="0.36"/>
      <stop offset="0.58" stop-color="#2aa8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1c7430"/>
      <stop offset="0.56" stop-color="#0c421c"/>
      <stop offset="1" stop-color="#031005"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" x2="1">
      <stop offset="0" stop-color="#000711"/>
      <stop offset="0.18" stop-color="#000711" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000711" stop-opacity="0"/>
      <stop offset="1" stop-color="#000711"/>
    </linearGradient>
    <pattern id="grassStripes" width="136" height="500" patternUnits="userSpaceOnUse">
      <rect width="68" height="500" fill="#5bff72" opacity="0.06"/>
      <rect x="68" width="68" height="500" fill="#071408" opacity="0.1"/>
    </pattern>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#sky)"/>
