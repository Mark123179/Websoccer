# =============================================================
# Websoccer — Production Docker Compose (Hetzner)
#
# Services: web (Django/Gunicorn), db (PostgreSQL), redis, nginx.
# All credentials come from the server-local .env file (NEVER committed).
# =============================================================

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker + Result-Backend für Celery (Worker/Beat). Volume hält die
    # Broker-Queue über Neustarts hinweg (kleine, unkritische Daten).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # Persist uploaded media and collected static across rebuilds.
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Hintergrund-Jobs: Celery-Worker + Beat-Scheduler ---------------------
  # Gleiches Image wie "web", aber der Gunicorn-Entrypoint wird übersprungen
  # (entrypoint: []), damit stattdessen Celery startet. Broker/Result-Backend
  # ist der vorhandene redis-Service (REDIS_URL aus der .env).
  celeryworker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: []
    command: celery -A core worker --loglevel=info --concurrency=2
    # Worker-Tasks dürfen Medien anfassen (z. B. Avatar-Cleanups).
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -t 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celerybeat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: []
    # Beat plant Tasks gemäß CELERY_BEAT_SCHEDULE; der Schedule-Status liegt in
    # /tmp (nicht persistent — bei Neustart wird der Zeitplan neu aufgebaut).
    command: celery -A core beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Injected into the nginx template (server_name + certificate paths).
      DOMAIN: ${DOMAIN}
    volumes:
      # Template is rendered by the nginx image (envsubst) into conf.d at start.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # nginx serves static & media directly from the shared volumes (read-only).
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      # Let's Encrypt certificates + ACME webroot (written by the certbot service).
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates are picked up without downtime.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Attempt renewal every 12h; certbot only renews certs near expiry.
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
  certbot_certs:
  certbot_www:
