# =============================================================
# Websoccer nginx — HTTP-only bootstrap config
#
# Used when no TLS certificate exists yet (first start before
# init-letsencrypt.sh has run, or after volumes were wiped).
# nginx starts cleanly, answers the ACME HTTP-01 challenge, and
# proxies everything else to the Django app over plain HTTP.
#
# After the real certificate has been obtained, restart nginx:
#   docker compose restart nginx
# The entrypoint then switches to the full HTTPS config automatically.
# =============================================================

upstream websoccer_web {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # ACME HTTP-01 challenge (written by the certbot service).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Forward everything else to the Django app (plain HTTP, no redirect).
    location / {
        proxy_pass         http://websoccer_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }
}
