# =============================================================
# Websoccer — nginx reverse proxy (production V1, HTTP only)
#
# Serves /static/ and /media/ directly from disk and proxies
# everything else to the Gunicorn web container on port 8000.
#
# HTTPS / Let's Encrypt is a documented follow-up task (V2). To enable
# it later: add a 443 server block, mount certbot certs, and redirect
# port 80 → 443.
# =============================================================

upstream websoccer_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow large-ish uploads (avatars etc.)
    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://websoccer_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
